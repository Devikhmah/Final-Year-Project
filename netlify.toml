[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,MANAGER_SIGNUP_CODE,GEMINI_API_KEY,VITE_GEMINI_API_KEY"
  SECRETS_SCAN_OMIT_PATHS = ".env.example,README.md,tests/**"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
